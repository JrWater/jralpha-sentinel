<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Caveat";
        src: url("assets/fonts/Caveat-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      :root {
        --bg: #11151c;
        --bg2: #19212b;
        --panel: rgba(245, 239, 228, 0.055);
        --border: rgba(245, 239, 228, 0.19);
        --text: #f5efe4;
        --muted: #a8b1bd;
        --green: #72d89b;
        --red: #ff7b72;
        --amber: #f2c96d;
        --blue: #91adff;
        --ink: #2b3038;
        --paper: #f4dfa4;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--bg);
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
      }
      .mono { font-family: "SF Mono", Menlo, monospace; }

      .scene {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background:
          radial-gradient(1050px 680px at 84% 4%, rgba(114, 216, 155, 0.15), transparent 62%),
          radial-gradient(800px 560px at 8% 96%, rgba(242, 201, 109, 0.11), transparent 64%),
          var(--bg);
      }
      .scene::before {
        content: ""; position: absolute; inset: 34px; pointer-events: none;
        border: 2px solid rgba(244, 223, 164, 0.12); border-radius: 34px 27px 41px 30px;
        box-shadow: inset 0 0 0 4px rgba(145,173,255,0.018), 0 0 0 1px rgba(114,216,155,0.035);
      }
      .scene::after {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .26;
        background-image:
          radial-gradient(rgba(245,239,228,.27) .75px, transparent .75px),
          repeating-linear-gradient(13deg, transparent 0 19px, rgba(244,223,164,.045) 20px 21px);
        background-size: 7px 7px, 52px 52px;
        mix-blend-mode: soft-light;
      }
      .grid-overlay {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(145, 173, 255, 0.045) 2px, transparent 2px),
          linear-gradient(90deg, rgba(145, 173, 255, 0.04) 2px, transparent 2px);
        background-size: 64px 64px;
        opacity: .75;
      }
      .wrap { position: relative; z-index: 2; height: 100%; padding: 90px 120px; display: flex; flex-direction: column; }

      .kicker {
        display: block; font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--amber); font-weight: 800;
      }
      .kicker::before {
        content: "✦"; margin-right: 11px; color: var(--green); font-size: 18px;
      }
      .h1 { position: relative; width: fit-content; font-size: 76px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); line-height: 1.05; margin-top: 18px; max-width: 1500px; }
      .h1::after {
        content: ""; position: absolute; left: 1%; right: 8%; bottom: -15px; height: 8px;
        border-top: 4px solid rgba(114,216,155,.72); border-radius: 50%; transform: rotate(-.6deg);
      }
      .h2 { font-size: 46px; font-weight: 800; letter-spacing: -0.02em; color: #fff; line-height: 1.15; margin-top: 16px; max-width: 1400px; }
      .lead { font-size: 24px; color: var(--muted); line-height: 1.55; margin-top: 22px; max-width: 1200px; }
      .lead b { color: var(--text); font-weight: 600; }

      .pill {
        display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700;
        padding: 8px 16px; border-radius: 999px; border: 2px dashed var(--border); background: var(--panel);
        color: var(--text);
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

      .vec {
        display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
        padding: 16px 22px; border-radius: 18px 14px 20px 15px;
        background: linear-gradient(118deg, rgba(244,223,164,.10), rgba(245,239,228,.035)); border: 2px solid var(--border);
        box-shadow: 5px 5px 0 rgba(145,173,255,.08), -2px -2px 0 rgba(244,223,164,.035);
      }
      .vec-rail { width: 5px; height: 34px; border-radius: 3px; display: inline-block; }
      .vec-name { font-size: 25px; font-weight: 800; min-width: 132px; }
      .vec-desc { font-size: 19px; color: var(--muted); }
      .vec-ev {
        font-size: 15px; font-weight: 700; padding: 6px 13px; border-radius: 999px;
        border: 1px solid var(--border); color: var(--muted);
        font-family: "SF Mono", Menlo, monospace;
      }
      /* the PEAD leg is struck through in-scene, exactly as the narration
         says it was removed on three years of negative-drift evidence */
      .vec-ev.killed {
        text-decoration: line-through;
        border-color: rgba(239,107,107,.4); color: var(--red);
      }

      .cap {
        position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
        max-width: 1640px; text-align: center; font-size: 46px; font-weight: 600;
        color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6);
        opacity: 0; padding: 0 24px; display: block;
      }
      /* scene 08's frame is a full-bleed screenshot with its own baked-in
         bottom caption; give burned-in captions a solid bar there instead of
         floating text, so the two never occupy the same pixels unreadably. */
      .cap-bar {
        left: 0; bottom: 0; transform: none; width: 100%; max-width: none;
        background: linear-gradient(0deg, rgba(8,11,16,.97) 0%, rgba(8,11,16,.97) 70%, rgba(8,11,16,0) 100%);
        padding: 22px 24px 20px; font-size: 44px;
      }

      .card {
        position: relative; background: var(--panel); border: 2px solid var(--border);
        border-radius: 19px 14px 21px 16px;
        background-image: linear-gradient(118deg, rgba(244,223,164,.095), rgba(245,239,228,.03));
        box-shadow: 7px 7px 0 rgba(145,173,255,.085), -2px -2px 0 rgba(244,223,164,.035), 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      .pipe-box::before {
        content: attr(data-step); position: absolute; right: 18px; top: -20px; width: 45px; height: 45px;
        display: grid; place-items: center; border-radius: 50% 45% 52% 43%;
        border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
        font: 800 17px/1 "SF Mono", Menlo, monospace; transform: rotate(4deg);
      }
      .sketch-note {
        position: absolute; z-index: 5; padding: 16px 21px; min-width: 190px;
        border: 2px solid var(--ink); border-radius: 9px 13px 8px 12px;
        background: var(--paper); color: var(--ink); box-shadow: 6px 7px 0 rgba(0,0,0,.28);
        font: 700 28px/1.5 "Caveat", Georgia, serif; letter-spacing: .01em;
      }
      .sketch-note::before {
        content: ""; position: absolute; width: 58px; height: 18px; left: 50%; top: -11px;
        transform: translateX(-50%) rotate(-3deg); background: rgba(235,226,198,.7);
        border: 1px solid rgba(43,48,56,.25);
      }
      .sketch-note span { display: block; }
      .note-br { right: 118px; bottom: 186px; transform: rotate(-2deg); }
      .note-tr { right: 118px; top: 82px; transform: rotate(2deg); }
      .stamp {
        position: absolute; z-index: 5; right: 128px; top: 88px; padding: 12px 20px;
        border: 4px double var(--green); border-radius: 10px 7px 12px 8px;
        color: var(--green); font: 900 22px/1 "SF Mono", Menlo, monospace;
        letter-spacing: .13em; transform: rotate(4deg); opacity: 0;
      }
      .bot {
        position: absolute; z-index: 4; width: 190px; height: 190px;
        filter: drop-shadow(8px 10px 0 rgba(0,0,0,.22));
      }
      .bot-title { left: 248px; top: 250px; opacity: 0; }
      .bot-close { left: 318px; top: 330px; width: 150px; height: 150px; opacity: 0; }
      .bot .ink { fill: var(--paper); stroke: var(--ink); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .bot .accent { fill: none; stroke: var(--green); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .bot .face { fill: var(--ink); }
      .scribble-arrow { fill: none; stroke: var(--amber); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }

      /* The title scene gets its own evolving pencil sketch. These are not
         decorative facts: they visually restate narration already on screen. */
      .s01-orbit { position: absolute; z-index: 2; left: 166px; top: 166px; width: 430px; height: 430px; opacity: 0; }
      .s01-orbit path { fill: none; stroke: var(--amber); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 15; opacity: .55; }
      .s01-orbit circle { fill: var(--green); stroke: var(--ink); stroke-width: 3; }
      .s01-paper-strip { position: absolute; z-index: 2; left: 116px; top: 146px; width: 460px; height: 458px; opacity: 0; pointer-events: none; }
      .s01-paper-strip::before, .s01-paper-strip::after { content: ""; position: absolute; border: 2px solid rgba(244,223,164,.22); border-radius: 37px 46px 33px 51px; }
      .s01-paper-strip::before { inset: 32px 56px 48px 42px; transform: rotate(-8deg); }
      .s01-paper-strip::after { inset: 70px 26px 22px 76px; border-color: rgba(114,216,155,.17); transform: rotate(9deg); }
      .s01-note { right: 152px; top: 132px; transform: rotate(3deg); opacity: 0; }
      .s01-note small { display: block; margin-top: 8px; font: 700 16px/1.1 "SF Mono", Menlo, monospace; letter-spacing: .03em; color: rgba(43,48,56,.72); }
      .s01-gates { position: absolute; z-index: 4; right: 148px; top: 328px; width: 290px; padding: 22px 25px 20px; opacity: 0; }
      .s01-gates-title { color: var(--text); font: 800 16px/1 "SF Mono", Menlo, monospace; letter-spacing: .11em; }
      .s01-gate-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
      .s01-gate { height: 34px; border: 3px solid rgba(245,239,228,.42); border-radius: 8px 5px 9px 6px; background: rgba(17,21,28,.55); box-shadow: 2px 2px 0 rgba(244,223,164,.08); }
      .s01-gate.ready { border-color: var(--green); background: rgba(114,216,155,.28); box-shadow: 2px 2px 0 rgba(114,216,155,.18); }
      .s01-callout { position: absolute; z-index: 5; right: 86px; top: 286px; width: 420px; height: 260px; pointer-events: none; opacity: 0; }
      .s01-callout svg { width: 100%; height: 100%; overflow: visible; }
      .s01-callout path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #s01-callout-outline { stroke: var(--amber); stroke-width: 6; }
      #s01-callout-scribble { stroke: var(--amber); stroke-width: 3; opacity: .32; }
      #s01-callout-connector { stroke: var(--paper); stroke-width: 4; }
      .s01-callout-label { position: absolute; left: 6px; top: 216px; color: var(--paper); font: 700 31px/1.12 "Caveat", Georgia, serif; letter-spacing: .02em; opacity: 0; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
      .s01-callout-label span { display: block; }
      .s01-callout-label span + span { margin-top: 7px; }

      .arrow { position: relative; height: 3px; background: var(--border); transform-origin: left center; }
      .arrow::after {
        content: ""; position: absolute; right: -1px; top: 50%; transform: translateY(-50%);
        border-left: 10px solid var(--border); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
      }
      .arrow.on { background: var(--green); }
      .arrow.on::after { border-left-color: var(--green); }

      footer.scene-footer {
        position: absolute; left: 120px; bottom: 56px; font-size: 16px; color: var(--muted);
      }
    </style>

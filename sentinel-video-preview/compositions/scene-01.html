          const SPEED = 1.16;

          const s01FrameLen = s01FramePath.getTotalLength();

          tl.set("#s01-frame", { opacity: 1 }, S(0.05));
          tl.to(s01FramePath, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, S(0.05));
          tl.fromTo("#s01-orbit", { opacity: 0, scale: 0.82, rotation: -14 }, { opacity: 1, scale: 1, rotation: 0, duration: 1.0, ease: "power2.out" }, S(0.18));

          tl.fromTo("#s01-sub", { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.7, ease: "sine.out" }, S(1.5));
          tl.to("#s01-mark", { y: -8, scale: 1.018, duration: 3.2, ease: "sine.inOut", repeat: 1, yoyo: true }, S(2.3));
          tl.fromTo("#s01-note", { opacity: 0, x: 38, y: -16, rotation: 9 }, { opacity: 1, x: 0, y: 0, rotation: 3, duration: 0.58, ease: "back.out(1.7)" }, S(3.9));

          const s01Scribble = document.querySelector("#s01-callout-scribble");
          const s01Connector = document.querySelector("#s01-callout-connector");
          const s01Hash = (n) => {
            const x = Math.sin(n * 127.1 + 4 * 311.7) * 43758.5453;
            return (x - Math.floor(x)) * 2 - 1;
          };
          const s01Ellipse = (cx, cy, rx, ry) => {
            const count = 14, points = [];
            for (let i = 0; i < count; i += 1) {
              const angle = (i / count) * Math.PI * 2;
              const wobble = 1 + s01Hash(i * 13 + 5) * 0.04;
              points.push([cx + Math.cos(angle) * rx * wobble, cy + Math.sin(angle) * ry * wobble]);
            }
            const first = points[0], last = points[count - 1];
            let d = `M ${((first[0] + last[0]) / 2).toFixed(1)} ${((first[1] + last[1]) / 2).toFixed(1)}`;
            for (let i = 0; i < count; i += 1) {
              const p = points[i], q = points[(i + 1) % count];
              d += ` Q ${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`;
            }
            return d;
          };
          s01Outline.setAttribute("d", s01Ellipse(245, 108, 146, 78));
          s01Scribble.setAttribute("d", "M 136 56 L 356 72 L 131 92 L 360 111 L 129 130 L 352 150 L 145 171");
